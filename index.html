<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的地盘</title>
    <style>
        body {
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            height: 100vh;           /* 占满整个屏幕高度 */
            margin: 0;
            background-color: #6666ff; /* 背景色 */
        }

        h1 {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif; /* 优先用微软雅黑或黑体 */
            font-size: 80px;         /* 字号超级大 */
            font-weight: 900;        /* 字重：最粗的黑体 */
            color: #000000;          /* 颜色：纯黑 */
            text-align: center;      /* 文字居中 */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2); /* 加一点阴影 */
            margin-bottom: 30px; /* 底部边距 */
        }

        /* 手机屏幕优化：如果屏幕太小，字自动变小一点，防止撑破屏幕 */
        @media (max-width: 600px) {
            h1 {
                font-size: 40px; margin-bottom: 30px; 
            }
        }

        a {
            padding: 10px 20px;
            background-color: white;
            color: #6666ff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h1>这是我的地盘</h1>
    <a href="about/">我是谁</a>
</body>
</html>
